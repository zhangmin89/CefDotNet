name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-15]
    defaults:
      run:
        shell: pwsh
    env:
      CI_SOLUTION: ${{ startsWith(matrix.os, 'windows-') && 'CefDotNet.slnx' || 'CefDotNet.CrossPlatform.slnf' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK and test runtime
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.400

      - name: Install Linux browser prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgtk-3-0 libnss3 libasound2

      - name: Restore
        run: dotnet restore $env:CI_SOLUTION

      - name: Build
        id: build
        run: dotnet build $env:CI_SOLUTION -c Release --no-restore -m:1

      - name: Test on Linux
        if: runner.os == 'Linux'
        env:
          # Reserve TLS capacity; the ARM64 failure probe also reports alignment.
          GLIBC_TUNABLES: ${{ runner.arch == 'ARM64' && 'glibc.rtld.optional_static_tls=16384' || '' }}
        run: xvfb-run --auto-servernum dotnet test $env:CI_SOLUTION -c Release --no-build -m:1 --logger trx --results-directory artifacts/test-results --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type none

      - name: Test on Windows
        if: runner.os == 'Windows'
        run: dotnet test $env:CI_SOLUTION -c Release --no-build -m:1 --logger trx --results-directory artifacts/test-results --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type none

      - name: Test core and build integration on macOS
        if: runner.os == 'macOS'
        run: dotnet test tests/CefGlue.Tests/CefGlue.Tests.csproj -c Release --no-build -m:1 --logger trx --results-directory artifacts/test-results --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type none

      - name: Test Avalonia on the macOS main thread
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.build.outcome == 'success' }}
        run: dotnet tests/CefGlue.Avalonia.Tests/bin/Release/net8.0/CefGlue.Avalonia.Tests.dll artifacts/test-results/avalonia.xml

      - name: Diagnose CEF loading on Linux ARM64
        if: ${{ failure() && runner.os == 'Linux' && runner.arch == 'ARM64' && steps.build.outcome == 'success' }}
        env:
          GLIBC_TUNABLES: glibc.rtld.optional_static_tls=16384
        run: python3 .github/scripts/probe-cef-load.py tests/CefGlue.Avalonia.Tests/bin/Release/net8.0/libcef.so

      - name: Upload test results and CEF logs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            artifacts/test-results/
            tests/CefGlue.Avalonia.Tests/bin/Release/net8.0/cef-tests.log
