name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Same-repository branches are tested on push; fork contributions are tested on PR.
    # Keep push validation for every branch without running the matrix twice for same-repo PRs.
    # Tradeoff: same-repo PRs validate the branch head, not the synthetic merge commit.
    # Fork PRs validate the merge commit. Changing this policy requires PR-aware push gating.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Runs 34560991497 / 34565425123: slowest job 10m45s, including post-job steps.
    # Budget: 11m baseline + 7m cold-cache variance + 5m monitor self-test
    # + 10m watchdog + 2m diagnostics/cleanup + 5m upload = 40m.
    # This is an operational allowance, not a bound for multiple suites hanging in succession.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-15]
    defaults:
      run:
        shell: pwsh
    env:
      CI_SOLUTION: ${{ startsWith(matrix.os, 'windows-') && 'CefDotNet.slnx' || 'CefDotNet.CrossPlatform.slnf' }}
      CEFGLUE_TRACE_JAVASCRIPT: '1'
      DOTNET_DUMP_VERSION: '10.0.731102'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test CI diagnostics summarizer
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', '.github/scripts/tests', '-p', 'test_ci_diagnostics.py', '-v'], check=True)

      - name: Set up .NET SDK and test runtime
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.400

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', '**/*.csproj') }}
          # Reuse unchanged packages when the dependency hash changes; restore fills any gaps.
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Linux browser prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgtk-3-0 libnss3 libasound2

      - name: Cache test diagnostics tool
        id: diagnostics_cache
        uses: actions/cache@v6
        with:
          path: artifacts/tools
          key: ${{ runner.os }}-${{ runner.arch }}-dotnet-dump-${{ env.DOTNET_DUMP_VERSION }}

      - name: Install test diagnostics tool
        if: steps.diagnostics_cache.outputs.cache-hit != 'true'
        run: dotnet tool install dotnet-dump --tool-path artifacts/tools --version $env:DOTNET_DUMP_VERSION

      # Includes process-ownership tests and real timeout/dump/child-cleanup checks.
      - name: Test CI monitor
        id: monitor_self_test
        timeout-minutes: 5
        run: |
          $toolName = if ($IsWindows) { 'dotnet-dump.exe' } else { 'dotnet-dump' }
          $commandToken = [Guid]::NewGuid().ToString('N')
          # The fixture intentionally emits ::error::; preserve its output without false annotations.
          Write-Output "::stop-commands::$commandToken"
          try {
            pwsh -NoProfile -File ./.github/scripts/tests/Test-TestMonitor.ps1 -DumpToolPath "artifacts/tools/$toolName"
            $testExit = $LASTEXITCODE
          } finally {
            Write-Output "::${commandToken}::"
          }
          exit $testExit

      - name: Upload failed monitor self-test diagnostics
        if: ${{ always() && steps.monitor_self_test.outcome == 'failure' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: test-monitor-self-test-${{ matrix.os }}
          path: artifacts/monitor-self-test-*/

      - name: Restore
        run: dotnet restore $env:CI_SOLUTION

      - name: Build
        id: build
        run: dotnet build $env:CI_SOLUTION -c Release --no-restore -m:1 '-flp:logfile=artifacts/build-warnings.log;warningsonly'

      - name: Isolate macOS native class collision
        if: runner.os == 'macOS'
        run: ./.github/scripts/Collect-MacNativeDiagnostics.ps1

      - name: Prepare and verify CEF loading on Linux ARM64
        id: cef_load
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        shell: bash
        env:
          GLIBC_TUNABLES: glibc.rtld.optional_static_tls=16384
        run: |
          mkdir -p artifacts/native
          cc -shared -fPIC -Wl,-z,defs .github/scripts/cef-test-tls.c -o artifacts/native/libcef-test-tls.so
          LD_PRELOAD="$PWD/artifacts/native/libcef-test-tls.so" python3 .github/scripts/probe-cef-load.py tests/CefGlue.Avalonia.Tests/bin/Release/net8.0/libcef.so

      - name: Test core units
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.cef_load.outcome != 'failure' }}
        run: ./.github/scripts/Run-CiTests.ps1 -Suite core

      - name: Test build integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.cef_load.outcome != 'failure' }}
        run: ./.github/scripts/Run-CiTests.ps1 -Suite build

      - name: Test Avalonia
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.cef_load.outcome != 'failure' }}
        run: ./.github/scripts/Run-CiTests.ps1 -Suite avalonia

      - name: Test WPF
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build.outcome == 'success' }}
        run: ./.github/scripts/Run-CiTests.ps1 -Suite wpf

      # CEF rendering mode and renderer crashes require separate test processes.
      - name: Test Avalonia off-screen rendering
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.cef_load.outcome != 'failure' }}
        run: ./.github/scripts/Run-CiTests.ps1 -Suite osr

      - name: Test renderer termination and recovery
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.cef_load.outcome != 'failure' }}
        run: ./.github/scripts/Run-CiTests.ps1 -Suite renderer

      - name: Summarize warnings and test phase timings
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, '.github/scripts/summarize-ci-diagnostics.py', 'artifacts/build-warnings.log', 'artifacts/test-results', '--output', 'artifacts/ci-diagnostics.json'], check=True)

      - name: Upload test results and CEF logs
        if: ${{ always() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            artifacts/test-results/
            artifacts/build-warnings.log
            artifacts/ci-diagnostics.json
            tests/**/bin/Release/net8.0/**/javascript-execution-*.log
