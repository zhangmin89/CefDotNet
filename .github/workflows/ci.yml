name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-15]
    defaults:
      run:
        shell: pwsh
    env:
      CI_SOLUTION: ${{ runner.os == 'Windows' && 'CefDotNet.slnx' || 'CefDotNet.CrossPlatform.slnf' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK and test runtime
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.400

      - name: Install Linux browser prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgtk-3-0 libnss3 libasound2

      - name: Restore
        run: dotnet restore $env:CI_SOLUTION

      - name: Build
        run: dotnet build $env:CI_SOLUTION -c Release --no-restore -m:1

      - name: Test on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum dotnet test $env:CI_SOLUTION -c Release --no-build -m:1 --logger trx --results-directory artifacts/test-results --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type none

      - name: Test on Windows and macOS
        if: runner.os != 'Linux'
        run: dotnet test $env:CI_SOLUTION -c Release --no-build -m:1 --logger trx --results-directory artifacts/test-results --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type none
